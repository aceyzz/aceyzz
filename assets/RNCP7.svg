<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="270" height="270" viewBox="0 0 270 270" role="img" aria-labelledby="cert-title cert-desc">
  <title id="cert-title">Certification RNCP 7 - Cédric Muller</title>
  <description id="cert-desc">Badge de certification RNCP Niveau 7 - Expert en Architecture Informatique</description>

  <defs>
    <!-- Variables -->
    <g id="cert-variables">
      <text id="var-cert-issuer">MASTER DEGREE</text>
      <text id="var-cert-level">RNCP 7</text>
      <text id="var-cert-title">EXPERT EN ARCHITECTURE</text>
      <text id="var-cert-subtitle">INFORMATIQUE</text>
      <text id="var-cert-spec">Systèmes &amp; Réseaux</text>
      <text id="var-cert-status">CERTIFIED</text>
    </g>

    <!-- Gradients standards du dashboard -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f0c1b" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="magentaCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Gradient Doré Animé pour le Blason 42 -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="35%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Halos Radiaux confinés -->
    <radialGradient id="auraCenter" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.035" />
    </pattern>

    <clipPath id="squareClip">
      <rect x="2" y="2" width="266" height="266" rx="20" />
    </clipPath>
  </defs>

  <!-- Fond principal -->
  <g clip-path="url(#squareClip)">
    <rect x="2" y="2" width="266" height="266" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="266" height="266" fill="url(#auraCenter)" />
    <rect x="2" y="2" width="266" height="266" fill="url(#grid)" />
  </g>

  <!-- Bordure Néon externe -->
  <rect x="2" y="2" width="266" height="266" rx="20" fill="none" stroke="url(#neonBorder)" stroke-width="1.75" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Inter, sans-serif">
    
    <!-- HEADER DU BADGE -->
    <use href="#var-cert-issuer" x="135" y="28" fill="#00f2fe" font-size="8" font-weight="800" letter-spacing="1.8" text-anchor="middle" />

    <!-- BLASON CENTRAL AVEC BORDURE DORÉE ANIMÉE -->
    <g transform="translate(111, 40)">
      <!-- Lueur d'ambiance dorée -->
      <rect width="48" height="48" rx="14" fill="none" stroke="url(#goldShine)" stroke-width="3" opacity="0.4" />
      
      <!-- Fond du badge -->
      <rect width="48" height="48" rx="14" fill="#030712" stroke="url(#goldShine)" stroke-width="1.75" />
      
      <!-- Logo 42 Officiel vectorisé -->
      <svg x="8" y="12.5" width="32" height="23" viewBox="0 0 137.6 96.6" overflow="visible">
        <g transform="translate(-229.2, -372.7)">
          <polygon points="229.2,443.9 279.9,443.9 279.9,469.3 305.2,469.3 305.2,423.4 254.6,423.4 305.2,372.7 279.9,372.7 229.2,423.4" fill="#ffffff" />
          <polygon points="316.1,398.1 341.4,372.7 316.1,372.7" fill="#ffffff" />
          <polygon points="341.4,398.1 316.1,423.4 316.1,448.7 341.4,448.7 341.4,423.4 366.8,398.1 366.8,372.7 341.4,372.7" fill="#ffffff" />
          <polygon points="366.8,423.4 341.4,448.7 366.8,448.7" fill="#ffffff" />
        </g>
      </svg>
    </g>

    <!-- CARTE CENTRALE DES TITRES -->
    <g transform="translate(20, 100)">
      <rect width="230" height="106" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.7" stroke-width="1" />
      
      <!-- Grade principal -->
      <use href="#var-cert-level" x="115" y="24" fill="#ec4899" font-size="14" font-weight="900" letter-spacing="1.5" text-anchor="middle" />
      
      <!-- Intitulé Officiel -->
      <use href="#var-cert-title" x="115" y="44" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.5" text-anchor="middle" />
      <use href="#var-cert-subtitle" x="115" y="58" fill="#ffffff" font-size="11" font-weight="800" letter-spacing="0.5" text-anchor="middle" />

      <!-- Ligne de séparation fine -->
      <line x1="30" y1="72" x2="200" y2="72" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />

      <!-- Spécialité / Branche -->
      <use href="#var-cert-spec" x="115" y="90" fill="#38bdf8" font-size="10" font-weight="700" letter-spacing="0.5" text-anchor="middle" />
    </g>

    <!-- PIED : Statut Clignotant Centré -->
    <g transform="translate(135, 236)">
      <use href="#var-cert-status" x="0" y="0" fill="#22c55e" font-size="9.5" font-weight="800" letter-spacing="2" text-anchor="middle">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" />
      </use>
    </g>

  </g>
</svg>
